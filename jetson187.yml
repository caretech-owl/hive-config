compose:
- compose/gerd_jetson.yml
endpoints:
- icon: hub
  name: GERD Router
  port: 7860
  protocol: http
- icon: chat
  name: Chat mit Sprachmodell
  port: 8000
  protocol: http
environment:
  GERD_VERSION: latest
  GGUF_FILE: Qwen3-8B-Q4_1.gguf
  GRADIO_SERVER_PORT: '23232'
  HF_REPO: unsloth/Qwen3-8B-GGUF
  LLAMA_CPP_VERSION: llama_cpp:b5283-r36.4-cu128-24.04
  MODEL_ARGS: --gpu-layers 30 --n-gpu-layers 999 --ctx-size 1024 --threads $(nproc)
